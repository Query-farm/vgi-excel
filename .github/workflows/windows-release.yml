name: Windows release candidate
on:
  workflow_dispatch:
    inputs:
      production:
        description: Require timestamped production signatures
        type: boolean
        default: false
      signing_provider:
        description: Production signing provider
        type: choice
        options: [azure, certificate-store]
        default: azure
permissions:
  contents: read
  id-token: write
concurrency:
  group: cupola-windows-release
  cancel-in-progress: false
jobs:
  package:
    # Dedicated Windows/Excel test runner, never a user's working desktop.
    runs-on: [self-hosted, Windows, X64, cupola-release]
    environment: cupola-release
    env:
      VGI_EXCEL_TELEMETRY: '0'
      VITE_SENTRY_ENABLED: '0'
      CUPOLA_PRODUCTION: ${{ inputs.production }}
      CUPOLA_VGI_EXTENSION_PATH: ${{ vars.CUPOLA_VGI_EXTENSION_PATH }}
      CUPOLA_SIGNING_PROVIDER: ${{ inputs.signing_provider }}
      CUPOLA_AZURE_ENDPOINT: ${{ vars.CUPOLA_AZURE_ENDPOINT }}
      CUPOLA_AZURE_ACCOUNT: ${{ vars.CUPOLA_AZURE_ACCOUNT }}
      CUPOLA_AZURE_PROFILE: ${{ vars.CUPOLA_AZURE_PROFILE }}
      CUPOLA_AZURE_SUBJECT: ${{ vars.CUPOLA_AZURE_SUBJECT }}
      CUPOLA_SIGNING_THUMBPRINT: ${{ vars.CUPOLA_SIGNING_THUMBPRINT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Validate web clients
        shell: powershell
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npx playwright install chromium
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:ui
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run test:office-wasm
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build pinned native inputs
        shell: powershell
        run: |
          # Runner service must start with the x64 VS Developer environment.
          python windows/build-native-inputs.py --vgi-extension "$env:CUPOLA_VGI_EXTENSION_PATH"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Validate Windows hosts and package
        shell: powershell
        run: |
          $native = Join-Path $PWD 'artifacts/native-inputs'
          & tests/run-windows.ps1 -HaybarnPath "$native/haybarn.exe" -VgiExtensionPath "$native/vgi.duckdb_extension" -OdbcDriverPath "$native/haybarn_odbc.dll" -SkipWebBuild
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Azure login for signing
        if: inputs.production && inputs.signing_provider == 'azure'
        uses: Azure/login@935127ca5bb3c4b02c9c2c10060028383878f33f
        with:
          client-id: ${{ secrets.CUPOLA_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CUPOLA_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CUPOLA_AZURE_SUBSCRIPTION_ID }}
      - name: Publish signed production package
        if: inputs.production
        shell: powershell
        run: |
          $native = Join-Path $PWD 'artifacts/native-inputs'
          $signing = @{}
          if ($env:CUPOLA_SIGNING_PROVIDER -eq 'azure') {
            Install-PackageProvider NuGet -MinimumVersion 2.8.5.201 -Scope CurrentUser -Force | Out-Null
            Install-Module ArtifactSigning -RequiredVersion 0.1.20 -Scope CurrentUser -Force
            $config = Join-Path $env:RUNNER_TEMP 'cupola-azure-signing.json'
            @{
              Endpoint = $env:CUPOLA_AZURE_ENDPOINT
              CodeSigningAccountName = $env:CUPOLA_AZURE_ACCOUNT
              CertificateProfileName = $env:CUPOLA_AZURE_PROFILE
              ExpectedSubject = $env:CUPOLA_AZURE_SUBJECT
            } | ConvertTo-Json | Set-Content $config -Encoding UTF8
            $signing.AzureSigningConfigPath = $config
          } else {
            $signing.CertificateThumbprint = $env:CUPOLA_SIGNING_THUMBPRINT
          }
          Remove-Item Env:VITE_SENTRY_ENABLED
          npm run build:desktop
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & windows/publish.ps1 -HaybarnPath "$native/haybarn.exe" -VgiExtensionPath "$native/vgi.duckdb_extension" -OdbcDriverPath "$native/haybarn_odbc.dll" -SkipWebBuild -BuildMsi -Production @signing
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cupola-windows-candidate
          path: |
            artifacts/deployment/
            artifacts/native-inputs/provenance.json
          if-no-files-found: error
